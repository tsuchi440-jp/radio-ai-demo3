<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>介助動作セルフチェック＆数理シミュレーション統合システム [Antigravity確定版]</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1100px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 18pt;
            color: #38bdf8;
            margin-top: 0;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 10px;
        }
        .system-switcher {
            background-color: #0c4a6e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #0284c7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .system-switcher label {
            font-weight: bold;
            font-size: 11pt;
            color: #f0fdf4;
        }
        .system-switcher select {
            padding: 8px 16px;
            font-size: 11pt;
            background-color: #1e293b;
            color: white;
            border: 1px solid #38bdf8;
            border-radius: 4px;
            cursor: pointer;
        }
        .video-split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-card {
            background-color: #020617;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid #334155;
            min-height: 380px;
        }
        video, canvas {
            width: 100%;
            max-width: 480px;
            height: 320px;
            background-color: #050510;
            border-radius: 6px;
            border: 1px solid #475569;
            object-fit: contain;
        }
        .file-input-wrapper {
            margin-top: 10px;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #38bdf8;
        }
        .task-list-panel {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 20px;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 11pt;
        }
        .task-item input
